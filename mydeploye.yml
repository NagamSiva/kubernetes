apiVersion: apps/v1
kind: Deployment
metadata:
  name: mydeploye
spec:
  replicas: 2
  selector:
    matchLabels:
      app: myapp
      version: 2.6.1
  template:
    metadata:
      labels:
        app: myapp
        version:  2.6.1
    spec:
      containers:
      - name: mycontainer
        image: maha4iac/mahalogin:1
        ports:
        - containerPort: 8080
